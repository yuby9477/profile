<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta property="og:title" content="선재하이테크 영업부 - 신동엽 선임매니저">
    <meta property="og:description" content="고객의 기술적 고민을 해결하는 최적의 솔루션을 제안합니다.">
    <meta property="og:image" content="bg-photo.jpg">
    <meta property="og:url" content="https://yuby9477.github.io/profile/"> <meta property="og:type" content="website">

    <title>동엽 - 디지털 명함</title>
    <style>
        /* 글로벌 설정: 스마트하고 차분한 테크톤 배경 */
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: #f4f6f9; 
            margin: 0; padding: 0;
            display: flex; justify-content: center;
            padding-bottom: 110px; /* 하단 플로팅 버튼을 위한 공간 */
            color: #222;
        }
        .container {
            width: 100%; max-width: 420px;
            position: relative;
        }

        /* 1. 상단 커버 이미지 (배경사진) */
        .cover-section {
            height: 260px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.7) 100%), url('bg-photo.jpg');
            background-size: cover;
            background-position: center;
            position: relative;
        }

        /* 2. 메인 프로필 카드 */
        .profile-card {
            background-color: #ffffff;
            border-radius: 24px;
            margin: -50px 20px 0; 
            padding: 32px 24px 24px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.06);
            position: relative;
            z-index: 2;
            text-align: center;
        }
        .tags { margin-bottom: 16px; }
        .tag {
            display: inline-block;
            background-color: rgba(30, 60, 114, 0.06);
            color: #1e3c72;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin: 0 3px;
        }
        .name { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }
        .job-title { margin: 8px 0 20px; font-size: 15px; color: #666; font-weight: 500; }
        
        /* 3. 연락처 퀵 버튼 */
        .action-buttons {
            display: flex; justify-content: center; gap: 16px;
            padding-top: 20px;
            border-top: 1px solid #f0f2f5;
        }
        .action-btn {
            display: flex; flex-direction: column; align-items: center; text-decoration: none;
            cursor: pointer;
        }
        .icon-circle {
            width: 50px; height: 50px;
            background-color: #f8f9fb;
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: 20px; color: #1e3c72;
            transition: all 0.2s;
        }
        .action-btn:hover .icon-circle { background-color: #1e3c72; color: #fff; }
        .action-name { margin-top: 8px; font-size: 12px; color: #555; font-weight: 600; }

        /* 4. 정보 블록 공통 스타일 */
        .info-block {
            background-color: #ffffff;
            border-radius: 24px;
            margin: 16px 20px 0;
            padding: 28px 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
        }
        .block-title {
            font-size: 14px; color: #1e3c72; font-weight: 800;
            margin: 0 0 16px 0; letter-spacing: 0.5px; text-transform: uppercase;
        }
        .intro-text { font-size: 15px; line-height: 1.6; color: #333; margin: 0; }
        
        .contact-row {
            display: flex; align-items: flex-start; margin-bottom: 16px;
        }
        .contact-row:last-child { margin-bottom: 0; }
        .contact-label { width: 80px; font-size: 13px; color: #888; font-weight: 500; margin-top: 2px; }
        .contact-value { font-size: 15px; color: #222; font-weight: 600; flex: 1; line-height: 1.4; }
        
        .phone-wrapper { display: flex; align-items: center; gap: 8px; }
        
        /* 복사 버튼 미니 스타일 */
        .copy-badge {
            background-color: #eef2f6;
            color: #1e3c72;
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            transition: background-color 0.2s;
        }
        .copy-badge:active { background-color: #dbe4f0; }

        /* 5. 링크 버튼 카드 */
        .link-card {
            display: flex; justify-content: space-between; align-items: center;
            background-color: #ffffff;
            border-radius: 16px;
            margin: 16px 20px 0; padding: 20px 24px;
            text-decoration: none; color: #222; font-weight: 700; font-size: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            border: 1px solid transparent;
            transition: border 0.2s;
        }
        .link-card:hover { border: 1px solid #1e3c72; }
        .link-icon { font-size: 18px; margin-right: 10px; }
        .link-arrow { color: #ccc; font-weight: 300; }

        /* 6. 하단 고정 플로팅 버튼 */
        .floating-bar {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: linear-gradient(to top, rgba(244,246,249,1) 60%, rgba(244,246,249,0));
            padding: 20px; box-sizing: border-box;
            display: flex; justify-content: center; z-index: 10;
            pointer-events: none;
        }
        .floating-btn {
            width: 100%; max-width: 380px;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white; border: none; border-radius: 16px;
            padding: 18px 0; font-size: 16px; font-weight: 700;
            box-shadow: 0 10px 25px rgba(30, 60, 114, 0.3);
            pointer-events: auto; cursor: pointer; transition: transform 0.2s;
        }
        .floating-btn:active { transform: scale(0.97); }
    </style>
</head>
<body>

<div class="container">
    
    <div class="cover-section"></div>

    <div class="profile-card">
        <div class="tags">
            <span class="tag">TECH SALES</span>
            <span class="tag">정전기 솔루션 </span>
            <span class="tag">B2B 영업</span>
        </div>
        <h1 class="name">신동엽 선임매니저</h1>
        <p class="job-title">선재하이테크 | 기술영업부</p>

        <div class="action-buttons">
            <a href="tel:010-5436-9034" class="action-btn">
                <div class="icon-circle">📞</div>
                <div class="action-name">전화</div>
            </a>
            <a href="#" onclick="copyEmail(event)" class="action-btn">
                <div class="icon-circle">📧</div>
                <div class="action-name">메일복사</div>
            </a>
            <a href="sms:010-5436-9034" class="action-btn">
                <div class="icon-circle">💬</div>
                <div class="action-name">문자</div>
            </a>
        </div>
    </div>

    <div class="info-block">
        <h2 class="block-title">About Me</h2>
        <p class="intro-text">
            단순한 납품을 넘어 고객사의 기술적 고민을 깊이 이해하고 최적의 솔루션을 제안합니다.  항상 최고의 컨디션으로 소통하겠습니다.
        </p>
    </div>

    <div class="info-block">
        <h2 class="block-title">Contact</h2>
        <div class="contact-row">
            <div class="contact-label">Mobile</div>
            <div class="contact-value phone-wrapper">
                010-5436-9034 
                <span class="copy-badge" onclick="copyPhone(event)">복사</span>
            </div>
        </div>
        <div class="contact-row">
            <div class="contact-label">Email</div>
            <div class="contact-value">sdy251101@sunstat.com</div>
        </div>
        <div class="contact-row">
            <div class="contact-label">Office</div>
            <div class="contact-value">경기도 오산시 경기대로632번길 129-12, 3층</div>
        </div>
    </div>

    <a href="https://sunstat.com/" target="_blank" class="link-card">
        <div><span class="link-icon">🌐</span> 선재하이테크 홈페이지</div>
        <span class="link-arrow">〉</span>
    </a>

</div>

<div class="floating-bar">
    <button class="floating-btn" onclick="location.href='tel:010-5436-9034'">전화걸기</button>
</div>

<script>
    // 이메일 복사 기능
    function copyEmail(event) {
        event.preventDefault(); 
        const email = "sdy251101@sunstat.com";
        navigator.clipboard.writeText(email).then(() => {
            alert("이메일 주소가 복사되었습니다! 🎉\n" + email);
        }).catch(err => {
            alert("복사에 실패했습니다. 브라우저 설정을 확인해주세요.");
        });
    }

    // 연락처 복사 기능
    function copyPhone(event) {
        event.preventDefault(); 
        const phone = "010-5436-9034"; 
        navigator.clipboard.writeText(phone).then(() => {
            alert("연락처가 복사되었습니다! 🎉\n" + phone);
        }).catch(err => {
            alert("복사에 실패했습니다. 브라우저 설정을 확인해주세요.");
        });
    }
</script>

</body>
</html>
