<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>동엽 - 디지털 명함</title>
    <style>
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card-container {
            background-color: #ffffff;
            width: 100%;
            max-width: 400px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            margin: 20px;
        }
        .header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 40px 20px 20px;
            text-align: center;
        }
        .profile-pic {
            width: 100px;
            height: 100px;
            background-color: #e0e0e0;
            border-radius: 50%;
            margin: 0 auto 15px;
            border: 4px solid white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #666;
            /* 실제 사용 시 아래 background-image 속성에 사진 링크를 넣으세요 */
            /* background-image: url('photo.jpg'); */
            background-size: cover;
            background-position: center;
        }
        .name {
            margin: 0;
            font-size: 24px;
            font-weight: 700;
        }
        .job-title {
            margin: 5px 0 0;
            font-size: 14px;
            opacity: 0.9;
        }
        .content {
            padding: 30px 20px;
        }
        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 5px;
        }
        .info-list {
            list-style: none;
            padding: 0;
            margin: 0 0 25px 0;
        }
        .info-list li {
            margin-bottom: 12px;
            font-size: 14px;
            color: #555;
            display: flex;
            align-items: center;
        }
        .info-list li strong {
            display: inline-block;
            width: 80px;
            color: #222;
        }
        .intro-text {
            font-size: 14px;
            line-height: 1.6;
            color: #555;
        }
        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #f0f0f0;
        }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #1e3c72;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: #152a51;
        }
    </style>
</head>
<body>

<div class="card-container">
    <div class="header">
        <div class="profile-pic"></div>
        <h1 class="name">동엽</h1>
        <p class="job-title">선재하이테크 | 영업부</p>
    </div>
    
    <div class="content">
        <h2 class="section-title">Contact</h2>
        <ul class="info-list">
            <li><strong>Email</strong> sdy251101@sunstat.com</li>
            <li><strong>Phone</strong> 010-5436-9034</li>
            <li><strong>Location</strong> 경기도 오산시 경기대로632번길 129-12, 3층</li>
        </ul>

        <h2 class="section-title">About Me</h2>
        <p class="intro-text">
            안녕하세요! 선재하이테크 영업부에서 신동엽선임매니저 입니다.<br><br>
            
        </p>

        <div class="social-links">
            <a href="tel:010-0000-0000" class="btn">전화걸기</a>
            <a href="mailto:your.email@example.com" class="btn">이메일 보내기</a>
        </div>
    </div>
</div>

</body>
</html>
