<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>동엽 - 디지털 명함</title>
    <style>
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card-container {
            background-color: #ffffff;
            width: 100%;
            max-width: 400px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            margin: 20px;
        }
        .header {
            /* 배경 사진(bg-photo.jpg)을 꽉 차게 넣고, 하얀 글씨가 잘 보이도록 어두운 막을 씌웠습니다 */
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('photo.jpg');
            background-size: cover;
            background-position: center;
            color: white;
            padding: 80px 20px 40px; 
            text-align: center;
        }
        .name {
            margin: 0;
            font-size: 28px;
            font-weight: 700;
        }
        .job-title {
            margin: 8px 0 0;
            font-size: 15px;
            opacity: 0.9;
        }
        .content {
            padding: 30px 20px;
        }
        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 5px;
        }
        .info-list {
            list-style: none;
            padding: 0;
            margin: 0 0 25px 0;
        }
        .info-list li {
            margin-bottom: 12px;
            font-size: 14px;
            color: #555;
            display: flex;
            align-items: center;
        }
        .info-list li strong {
            display: inline-block;
            width: 80px;
            color: #222;
        }
        .intro-text {
            font-size: 14px;
            line-height: 1.6;
            color: #555;
        }
        .social-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #f0f0f0;
        }
        .btn {
            display: inline-block;
            padding: 12px 20px;
            background-color: #1e3c72;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            transition: background-color 0.3s;
            flex: 1 1 40%;
            text-align: center;
            box-sizing: border-box;
        }
        .btn:hover {
            background-color: #152a51;
        }
        /* 회사 전용 버튼 (가로로 100% 꽉 차게) */
        .btn.company-btn {
            background-color: #2a5298; 
            flex: 1 1 100%; 
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="card-container">
    <div class="header">
        <h1 class="name">신동엽 선임매니저</h1>
        <p class="job-title">선재하이테크 | 영업부</p>
    </div>
    
    <div class="content">
        <h2 class="section-title">Contact</h2>
        <ul class="info-list">
            <li><strong>Email</strong> sdy251101@sunstat.com</li>
            <li><strong>Phone</strong> 010-5436-9034</li>
            <li><strong>Location</strong> 경기도 오산시 경기대로632번길 129-12, 3층</li>
        </ul>

        <h2 class="section-title">About Me</h2>
        <p class="intro-text">
            안녕하세요! 선재하이테크 영업부 신동엽선임매니저입니다.<br><br>
                   </p>

        <div class="social-links">
            <a href="tel:010-5436-9034" class="btn">전화걸기</a>
            <a href="#" onclick="copyEmail(event)" class="btn">이메일 복사</a>
            <a href="https://sunstat.com/" target="_blank" class="btn company-btn">선재하이테크 제품소개</a>
        </div>
    </div>
</div>

<script>
    function copyEmail(event) {
        // 클릭 시 페이지가 맨 위로 올라가는 기본 동작 방지
        event.preventDefault(); 
        
        const email = "sdy251101@sunstat.com";
        
        // 클립보드에 이메일 복사
        navigator.clipboard.writeText(email).then(() => {
            alert("이메일 주소가 복사되었습니다! 🎉\n" + email);
        }).catch(err => {
            alert("복사에 실패했습니다. 브라우저 설정을 확인해주세요.");
        });
    }
</script>

</body>
</html>
